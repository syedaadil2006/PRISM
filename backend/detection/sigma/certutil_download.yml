title: Certutil Used to Download a File
id: 5d1f8f3e-6b7a-4c1e-9b0a-1a2b3c4d0001
description: certutil.exe with -urlcache or -split and a URL fetches a payload while looking like a certificate tool.
author: PRISM
date: 2026-10-10
status: stable
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    - Image|endswith: '\certutil.exe'
    - CommandLine|contains: 'certutil'
  selection_flags:
    CommandLine|contains|windash:
      - '-urlcache'
      - '-split'
      - '-verifyctl'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: all of selection_*
falsepositives:
  - Administrators testing certificate revocation lists
level: high
tags:
  - attack.command_and_control
  - attack.t1105
