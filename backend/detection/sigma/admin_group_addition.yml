title: Account Added to the Administrators or Domain Admins Group
id: 5d1f8f3e-6b7a-4c1e-9b0a-1a2b3c4d0006
description: net localgroup administrators /add or net group "domain admins" /add grants an account full control.
author: PRISM
date: 2026-10-10
status: stable
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'net'
      - 'group'
      - '/add'
  privileged:
    CommandLine|contains:
      - 'administrators'
      - 'domain admins'
      - 'enterprise admins'
  condition: selection and privileged
falsepositives:
  - Administrators granting rights from the command line
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
