title: Microsoft Defender Protection Turned Off
id: 5d1f8f3e-6b7a-4c1e-9b0a-1a2b3c4d0012
description: Set-MpPreference -DisableRealtimeMonitoring or adding broad exclusions switches antivirus off before payloads run.
author: PRISM
date: 2026-10-10
status: stable
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'DisableRealtimeMonitoring $true'
      - 'DisableRealtimeMonitoring 1'
      - 'Add-MpPreference -ExclusionPath C:\'
      - 'DisableBehaviorMonitoring $true'
  condition: selection
falsepositives:
  - Rare troubleshooting
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.001
