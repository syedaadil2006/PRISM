title: Scheduled Task Created from the Command Line
id: 5d1f8f3e-6b7a-4c1e-9b0a-1a2b3c4d0003
description: schtasks /create running a script or an executable from a user-writable folder is a common way to persist.
author: PRISM
date: 2026-10-10
status: stable
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'schtasks'
      - '/create'
  suspicious_target:
    CommandLine|contains:
      - 'powershell'
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - 'cmd /c'
      - 'mshta'
      - 'wscript'
  condition: selection and suspicious_target
falsepositives:
  - Software installers creating update tasks
level: high
tags:
  - attack.persistence
  - attack.t1053.005
