title: Regsvr32 Loading a Remote Scriptlet
id: 5d1f8f3e-6b7a-4c1e-9b0a-1a2b3c4d0009
description: regsvr32 /i:http... scrobj.dll ("Squiblydoo") runs remote script code through a signed Windows binary.
author: PRISM
date: 2026-10-10
status: stable
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'regsvr32'
      - '/i:http'
  condition: selection
falsepositives:
  - Unknown
level: critical
tags:
  - attack.defense_evasion
  - attack.t1218.010
