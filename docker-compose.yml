# PRISM with Docker, on this computer only.
#
#   docker compose up -d --build     start (the first build downloads base images)
#   docker compose logs -f prism     follow the log
#   docker compose down              stop (data stays in the prism-data volume)
#
# Open http://localhost:8000. The access code is created on first start:
#   docker compose exec prism cat /data/.prism_token
#
# Local-only: the port is published on 127.0.0.1, so other computers cannot
# connect, and PRISM still refuses anything that is not this computer. Docker
# delivers this computer's requests from its internal network, which
# PRISM_LOCAL_NETWORKS marks as local.
#
# Optional Neo4j mirror (also on this computer only):
#   PRISM_NEO4J_PASSWORD=<a strong password> docker compose --profile neo4j up -d --build

services:
  prism:
    build: .
    image: prism:local
    container_name: prism
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRISM_PORT:-8000}:8000"
    environment:
      PRISM_DATASET: ${PRISM_DATASET:-synthetic}   # synthetic (demo), botsv1, or live
      PRISM_LOCAL_NETWORKS: '["172.16.0.0/12", "192.168.65.0/24"]'
      PRISM_BACKUP_INTERVAL_HOURS: "24"
      PRISM_BACKUP_KEEP: "7"
      PRISM_NEO4J_ENABLED: ${PRISM_NEO4J_ENABLED:-false}
      PRISM_NEO4J_URI: bolt://neo4j:7687
      PRISM_NEO4J_USER: neo4j
      PRISM_NEO4J_PASSWORD: ${PRISM_NEO4J_PASSWORD:-}
    volumes:
      - prism-data:/data
    read_only: true                     # only /data and /tmp are writable
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g

  neo4j:
    image: neo4j:5.26-community
    profiles: ["neo4j"]
    environment:
      # No default password: Neo4j refuses to start until PRISM_NEO4J_PASSWORD (8+ characters) is set.
      NEO4J_AUTH: neo4j/${PRISM_NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  prism-data:
  neo4j-data:
